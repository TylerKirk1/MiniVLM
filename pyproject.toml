[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm"
version = "0.1.0"
description = "Visual token bridge and text metrics for a small VLM experiment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.5.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
