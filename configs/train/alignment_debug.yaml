run:
  name: alignment_debug
  stage: alignment
  seed: 17

train:
  max_steps: 1000
  warmup_steps: 50
  save_every_steps: 250
  log_every_steps: 10

  per_device_batch_size: 1
  gradient_accumulation_steps: 32
  max_text_tokens: 512

  learning_rate_projector: 2.0e-4
  learning_rate_resampler: 2.0e-4
  learning_rate_lora: 0.0
  weight_decay: 0.01

  freeze_llm: true
  freeze_vision: true
  enable_qlora: false

  image_bucket_sizes:
    - 384
