run:
  name: sft_qlora
  stage: sft
  seed: 17

train:
  max_steps: 5000
  warmup_steps: 200
  save_every_steps: 500
  log_every_steps: 10

  per_device_batch_size: 1
  gradient_accumulation_steps: 64
  max_text_tokens: 768

  learning_rate_projector: 1.0e-4
  learning_rate_resampler: 1.0e-4
  learning_rate_lora: 5.0e-5
  weight_decay: 0.01

  freeze_llm: false
  freeze_vision: true
  enable_qlora: true

  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

  image_bucket_sizes:
    - 384
    - 448
