project:
  name: qwen3_siglip2_256
  description: Initial VLM stack for Qwen3-1.7B + SigLIP-2 NaFlex So400M.

model:
  llm:
    name: Qwen/Qwen3-1.7B
    hidden_size: 2048  # Provisional. Verify against the checkpoint config before first run.
    dtype: bfloat16
    quantization: 4bit

  vision:
    name: google/siglip2-so400m-patch16-naflex
    feature_dim: 1152  # Provisional. Verify against the checkpoint config before first run.
    image_size: 384
    patch_size: 16
    naflex: true
    freeze: true

  resampler:
    num_latents: 256
    latent_dim: 1024
    depth: 2
    num_heads: 8
    mlp_ratio: 4

  projector:
    hidden_dim: 2048
    activation: gelu

  prompt:
    prepend_visual_tokens: true
    image_start_token: "<image>"
    image_end_token: "</image>"
    answer_style: short
